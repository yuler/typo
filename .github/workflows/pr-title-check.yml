name: pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Re-running a job replays the original event payload, so read the
          # live title from the API rather than trusting the snapshot.
          PR_TITLE="$EVENT_PR_TITLE"
          if [[ -n "$PR_NUMBER" ]]; then
            LIVE_TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title' || true)"
            if [[ -n "$LIVE_TITLE" ]]; then
              PR_TITLE="$LIVE_TITLE"
            fi
          fi

          # PR title must match: <emoji> [<scope>]: <content>
          # e.g. ✨ [desktop,core]: Implement auth heartbeat
          pattern='^[^ ]+ \[[a-zA-Z,]+\]: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow the required format."
            echo ""
            echo "Expected format: <emoji> [<scope>]: <description>"
            echo "Examples:"
            echo "  ✨ [desktop,core]: Implement auth heartbeat and session revocation detection"
            echo "  🐛 [ui]: Fix button alignment"
            echo "  📝 [docs]: Update readme"
            echo ""
            echo "Your title: $PR_TITLE"
            exit 1
          fi
          echo "PR title format is valid: $PR_TITLE"
